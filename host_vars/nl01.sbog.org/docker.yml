---
# Docker config
docker_additional_networks:
  - name: tf_net_public
    driver: overlay
    bridge_name: tf_bridge
    subnet: 10.100.0.0/16
    gateway: 10.100.0.1
    iprange: 10.100.128.0/17
  - name: xray_net
    bridge_name: xray_bridge
    driver: overlay
    attachable: True
    subnet: 10.10.11.0/24
    gateway: 10.10.11.1
    iprange: 10.10.11.128/25

docker_live_restore: false
docker_swarm_manager: true
docker_swarm_configure: true

docker_swarm_node_labels:
  traefik: "yes"
